\* TLC model for Blindpool.tla
\*
\* Small but not trivial: 2 bettors x 2 epochs x 2 denominations x 2 sides is
\* enough to produce interleavings where one bettor reveals while another has not,
\* an epoch rolls over with an outstanding commit, and a forfeit lands in the same
\* pot a winner claims from. Those are the traces the invariants care about.
\*
\* Run:  java -cp tla2tools.jar tlc2.TLC -config Blindpool.cfg Blindpool.tla

SPECIFICATION Spec

CONSTANTS
    Bettors = {a, b}
    Denoms  = {1, 10}
    MaxEpoch = 1

INVARIANT Invariants
